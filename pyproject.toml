[project]
name = "ordnll"
version = "1.0.0"
description = "Ord-NLL: Negative Label Learning for Ordinal Noisy Labels (IEEE Access 2026)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "omegaconf",
    "pandas",
    "pillow",
    "scikit-learn",
    "tensorboard",
    "torch",
    "torchvision",
]

[tool.uv]
package = false

# CUDA 12.6 wheels (NVIDIA driver >= 560). Change the index URL to match your CUDA driver.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
